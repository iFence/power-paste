<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Power Paste</title>
  <style>
    /* 扫码页与桌面端互传页共用一套配色与尺寸：手机上打开也是一次会话。 */
    :root {
      color-scheme: dark;
      --app-text: #f4efe8;
      --app-muted: rgba(244, 239, 232, 0.68);
      --app-soft-text: rgba(244, 239, 232, 0.52);
      --app-panel-bg: rgba(34, 39, 48, 0.54);
      --app-panel-strong-bg: rgba(45, 51, 61, 0.66);
      --app-panel-border: rgba(255, 255, 255, 0.08);
      --app-input-bg: rgba(255, 255, 255, 0.06);
      --app-chip-bg: rgba(255, 255, 255, 0.06);
      --app-popover-bg: #232730;
      --app-bg: linear-gradient(180deg, #1e2128 0%, #171a1f 52%, #1c1f25 100%);
      --accent-primary: #f0b35f;
      --accent-primary-strong: #dd8648;
      --accent-primary-text: #24160d;
      --bubble-bg: rgba(45, 51, 61, 0.72);
      --danger: #f06d6d;
      --online: #44d17f;
    }

    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --app-text: #1d232d;
        --app-muted: rgba(29, 35, 45, 0.72);
        --app-soft-text: rgba(29, 35, 45, 0.52);
        --app-panel-bg: rgba(255, 255, 255, 0.62);
        --app-panel-strong-bg: rgba(255, 255, 255, 0.78);
        --app-panel-border: rgba(24, 36, 50, 0.18);
        --app-input-bg: rgba(255, 255, 255, 0.88);
        --app-chip-bg: rgba(29, 35, 45, 0.06);
        --app-popover-bg: #f6f2ec;
        --app-bg: linear-gradient(180deg, #f7f4ef 0%, #eff2f6 52%, #f4f6f8 100%);
        --bubble-bg: rgba(255, 255, 255, 0.88);
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--app-bg);
      background-attachment: fixed;
      color: var(--app-text);
      font-family:
        "Segoe UI Variable", "Microsoft YaHei UI", "PingFang SC",
        "Hiragino Sans GB", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* 页高优先用动态视口单位，手机地址栏收起时底部提示不会被顶出屏幕。 */
    .lan-page {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      /* 单列按容器宽度排布，避免内容固有宽度把整页撑出横向滚动。 */
      grid-template-columns: minmax(0, 1fr);
      height: 100vh;
      height: 100dvh;
      max-width: 640px;
      margin: 0 auto;
    }

    .lan-topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px 8px;
    }

    .lan-topbar-title {
      display: flex;
      flex: 1;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .lan-topbar-icon {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
    }

    .lan-topbar-title strong {
      font-size: 0.94rem;
    }

    .lan-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex: 0 0 auto;
      padding: 3px 8px;
      border: 1px solid var(--app-panel-border);
      border-radius: 999px;
      color: var(--app-muted);
      font-size: 0.68rem;
    }

    .lan-status-pill i {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--app-soft-text);
    }

    .lan-status-pill.pending i {
      background: var(--accent-primary);
    }

    .lan-status-pill.online i {
      background: var(--online);
      box-shadow: 0 0 8px rgba(68, 209, 127, 0.7);
    }

    .lan-status-pill.offline i {
      background: var(--danger);
    }

    /* 会话对象是这台电脑：头像沿用桌面端设备列表的电脑图标。 */
    .lan-peer-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px 10px;
      border-bottom: 1px solid var(--app-panel-border);
    }

    .lan-peer-avatar {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      flex: 0 0 auto;
      border: 1px solid var(--app-panel-border);
      border-radius: 999px;
      background: var(--app-panel-strong-bg);
      color: var(--accent-primary);
    }

    .lan-peer-avatar svg {
      width: 16px;
      height: 16px;
    }

    .lan-peer-info {
      display: grid;
      min-width: 0;
    }

    .lan-peer-info strong {
      overflow: hidden;
      font-size: 0.86rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lan-peer-info small {
      color: var(--app-muted);
      font-size: 0.68rem;
    }

    .lan-stream {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow-y: auto;
      padding: 14px;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    .lan-stream-note {
      margin: auto;
      padding: 0 16px;
      color: var(--app-soft-text);
      font-size: 0.76rem;
      text-align: center;
    }

    .lan-stream-note.error {
      color: var(--danger);
    }

    .lan-day-label {
      align-self: center;
      margin: 10px 0 8px;
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--app-chip-bg);
      color: var(--app-muted);
      font-size: 0.66rem;
    }

    .lan-bubble-row {
      display: grid;
      gap: 3px;
      padding: 3px 0;
    }

    .lan-bubble-row.incoming {
      justify-items: start;
    }

    .lan-bubble-time {
      color: var(--app-muted);
      font-size: 0.66rem;
    }

    .lan-bubble-line {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }

    .lan-bubble {
      display: grid;
      gap: 6px;
      min-width: 0;
      max-width: min(88%, 460px);
      padding: 8px 11px;
      border: 1px solid var(--app-panel-border);
      border-radius: 13px;
      background: var(--bubble-bg);
      color: var(--app-text);
    }

    .lan-bubble-text {
      margin: 0;
      font-size: 0.82rem;
      line-height: 1.45;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    /* 文本文件的正文直接铺在气泡里，过长时气泡内滚动。 */
    .lan-bubble-preview {
      max-height: 260px;
      overflow: auto;
    }

    .lan-bubble-file {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      padding: 5px 7px;
      border-radius: 9px;
      background: var(--app-chip-bg);
    }

    .lan-bubble-file svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      color: var(--app-muted);
    }

    .lan-bubble-file-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      font-size: 0.76rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lan-bubble-file small {
      flex: 0 0 auto;
      color: var(--app-muted);
      font-size: 0.68rem;
    }

    .lan-bubble-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .lan-ghost {
      display: inline-block;
      padding: 3px 9px;
      border: 1px solid var(--app-panel-border);
      border-radius: 8px;
      background: transparent;
      color: var(--app-text);
      font: inherit;
      font-size: 0.7rem;
      text-decoration: none;
      cursor: pointer;
    }

    .lan-ghost:hover {
      background: var(--app-chip-bg);
    }

    .lan-primary {
      padding: 6px 12px;
      border: 0;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent-primary-strong), var(--accent-primary));
      color: var(--accent-primary-text);
      font: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }

    .lan-footer {
      padding: 8px 14px calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--app-panel-border);
      background: var(--app-panel-bg);
    }

    .lan-footer p {
      margin: 0;
      color: var(--app-soft-text);
      font-size: 0.68rem;
      text-align: center;
    }

    .lan-modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.42);
    }

    .lan-modal[hidden] {
      display: none;
    }

    .lan-modal-card {
      display: grid;
      gap: 10px;
      width: min(100%, 330px);
      padding: 15px;
      border: 1px solid var(--app-panel-border);
      border-radius: 13px;
      background: var(--app-popover-bg);
      color: var(--app-text);
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.3);
    }

    .lan-modal-card small {
      color: var(--app-muted);
      font-size: 0.72rem;
    }

    .lan-modal-card input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--app-panel-border);
      border-radius: 8px;
      background: var(--app-input-bg);
      color: var(--app-text);
      font: inherit;
      font-size: 0.8rem;
    }

    .lan-modal-error {
      margin: 0;
      color: var(--danger);
      font-size: 0.72rem;
    }

    .lan-modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* 手机浏览器聚焦小于 16px 的输入框会自动放大页面，触屏下统一放大字号。 */
    @media (hover: none) {
      .lan-modal-card input {
        font-size: 16px;
      }
    }
  </style>
</head>

  <script>
    // 协议地址与文本包前缀：与桌面端分享文本时使用的文件名保持一致。
    var BASE_URL = '/api/localsend/v2';
    var TEXT_PACKAGE_PREFIX = 'PowerPaste-Text-';

    var zh = (navigator.language || '').toLowerCase().indexOf('zh') === 0;
    var text = {
      computer: zh ? '电脑端' : 'Computer',
      connecting: zh ? '连接中…' : 'Connecting…',
      connected: zh ? '已连接' : 'Connected',
      offline: zh ? '未连接' : 'Offline',
      waiting: zh ? '正在获取文件列表…' : 'Loading files…',
      files: zh ? '共 %d 个文件' : '%d file(s)',
      empty: zh ? '这台电脑还没有分享可下载的内容' : 'This computer is not sharing any files',
      footer: zh ? '点气泡上的「下载」即可把文件保存到手机' : 'Tap Download in a bubble to save it to your phone',
      download: zh ? '下载' : 'Download',
      showText: zh ? '查看文本' : 'Show text',
      copy: zh ? '复制文本' : 'Copy text',
      copied: zh ? '已复制' : 'Copied',
      copyFailed: zh ? '复制失败，请手动选择' : 'Copy failed, select manually',
      pinTitle: zh ? '输入 PIN' : 'Enter PIN',
      pinHint: zh ? '该电脑已设置 PIN，请输入后继续' : 'This computer requires a PIN',
      pinInvalid: zh ? 'PIN 不正确，请重新输入' : 'Incorrect PIN, please try again',
      pinTooMany: zh ? '尝试次数过多，请稍后再试' : 'Too many attempts, please try again later',
      pinPlaceholder: 'PIN',
      cancel: zh ? '取消' : 'Cancel',
      confirm: zh ? '继续' : 'Continue',
      error: zh ? '出错了' : 'Something went wrong'
    };

    var streamEl = document.getElementById('stream');
    var noteEl = document.getElementById('stream-note');
    var peerNameEl = document.getElementById('peer-name');
    var peerHintEl = document.getElementById('peer-hint');
    var connectionEl = document.getElementById('connection');
    var connectionLabelEl = document.getElementById('connection-label');
    var footerHintEl = document.getElementById('footer-hint');
    var pinModal = document.getElementById('pin-modal');
    var pinForm = document.getElementById('pin-form');
    var pinInput = document.getElementById('pin-input');
    var pinErrorEl = document.getElementById('pin-error');

    var sessionId = sessionStorage.getItem('ppSessionId') || '';
    var pin = sessionStorage.getItem('ppPin') || '';
    var pinTried = false;
    var loading = false;
    var lastDayLabel = '';

    /* ---------- 文案与基础工具 ---------- */

    function formatBytes(size) {
      var value = Number(size || 0);
      if (value < 1000) {
        return value + ' B';
      }
      if (value < 1000000) {
        return Math.round(value / 1000) + ' KB';
      }
      if (value < 1000000000) {
        return (value / 1000000).toFixed(1) + ' MB';
      }
      return (value / 1000000000).toFixed(2) + ' GB';
    }

    function pad2(value) {
      return (value < 10 ? '0' : '') + value;
    }

    // 气泡上方的时间标签：当天只显示时刻，昨天与更早补上日期。
    function formatMessageTime(timestampMs) {
      var date = new Date(timestampMs);
      var now = new Date();
      var time = pad2(date.getHours()) + ':' + pad2(date.getMinutes());
      var startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      var startOfDay = new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime();
      var dayDiff = Math.round((startOfToday - startOfDay) / 86400000);
      if (dayDiff <= 0) {
        return time;
      }
      if (dayDiff === 1) {
        return (zh ? '昨天 ' : 'Yesterday ') + time;
      }
      if (date.getFullYear() === now.getFullYear()) {
        return (zh
          ? (date.getMonth() + 1) + '月' + date.getDate() + '日 '
          : date.toLocaleString('en-US', { month: 'short' }) + ' ' + date.getDate() + ', ') + time;
      }
      return date.toLocaleDateString(zh ? 'zh-CN' : 'en-US') + ' ' + time;
    }

    // 消息流的日期分隔标题：今天 / 昨天 / 具体日期。
    function formatDayLabel(timestampMs) {
      var date = new Date(timestampMs);
      var now = new Date();
      var startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      var startOfDay = new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime();
      var dayDiff = Math.round((startOfToday - startOfDay) / 86400000);
      if (dayDiff <= 0) {
        return zh ? '今天' : 'Today';
      }
      if (dayDiff === 1) {
        return zh ? '昨天' : 'Yesterday';
      }
      if (date.getFullYear() === now.getFullYear()) {
        return zh
          ? (date.getMonth() + 1) + '月' + date.getDate() + '日'
          : date.toLocaleString('en-US', { month: 'short' }) + ' ' + date.getDate();
      }
      return date.toLocaleDateString(zh ? 'zh-CN' : 'en-US');
    }

    function parseJson(value) {
      try {
        return JSON.parse(value);
      } catch (error) {
        // 无效载荷返回 null，由调用方按失败处理。
        return null;
      }
    }

    function withPin(url) {
      if (!pin) {
        return url;
      }
      return url + (url.indexOf('?') === -1 ? '?' : '&') + 'pin=' + encodeURIComponent(pin);
    }

    function request(url, method, body, callback) {
      var xhr = new XMLHttpRequest();
      xhr.open(method, url, true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          callback(xhr);
        }
      };
      xhr.send(body || null);
      return xhr;
    }

    function scrollToBottom() {
      window.requestAnimationFrame(function () {
        streamEl.scrollTop = streamEl.scrollHeight;
      });
    }

    function setConnection(state) {
      connectionEl.className = 'lan-status-pill ' + state;
      if (state === 'online') {
        connectionLabelEl.innerText = text.connected;
        return;
      }
      if (state === 'offline') {
        connectionLabelEl.innerText = text.offline;
        return;
      }
      connectionLabelEl.innerText = text.connecting;
    }

    // 流中的提示行：加载中、空列表或失败原因都占用同一行，避免气泡错位。
    function setNote(message, isError) {
      noteEl.innerText = message || '';
      noteEl.className = isError ? 'lan-stream-note error' : 'lan-stream-note';
      noteEl.hidden = !message;
    }

    function setPeerName(name) {
      peerNameEl.innerText = name || text.computer;
    }

    function applyStaticText() {
      footerHintEl.innerText = text.footer;
      peerHintEl.innerText = text.waiting;
      document.getElementById('pin-title').innerText = text.pinTitle;
      document.getElementById('pin-hint').innerText = text.pinHint;
      document.getElementById('pin-cancel').innerText = text.cancel;
      document.getElementById('pin-submit').innerText = text.confirm;
      pinInput.placeholder = text.pinPlaceholder;
      setConnection('pending');
    }

    /* ---------- 会话气泡 ---------- */

    function isTextFile(file) {
      if (file.fileName && file.fileName.indexOf(TEXT_PACKAGE_PREFIX) === 0) {
        return true;
      }
      return String(file.fileType || '').indexOf('text/') === 0 || file.fileType === 'text';
    }

    function downloadUrl(fileId) {
      return BASE_URL + '/download?sessionId=' + encodeURIComponent(sessionId) +
        '&fileId=' + encodeURIComponent(fileId);
    }

    function insertDayLabel(timestampMs) {
      var label = formatDayLabel(timestampMs);
      if (label === lastDayLabel) {
        return;
      }
      lastDayLabel = label;
      var element = document.createElement('p');
      element.className = 'lan-day-label';
      element.innerText = label;
      streamEl.appendChild(element);
    }

    function buildFileRow(file) {
      var svgNs = 'http://www.w3.org/2000/svg';
      var row = document.createElement('div');
      row.className = 'lan-bubble-file';
      var icon = document.createElementNS(svgNs, 'svg');
      icon.setAttribute('viewBox', '0 0 24 24');
      icon.setAttribute('aria-hidden', 'true');
      var path = document.createElementNS(svgNs, 'path');
      path.setAttribute('d', 'M6 3.5h7l5 5V20.5H6zM13 3.5v5h5');
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', 'currentColor');
      path.setAttribute('stroke-width', '1.6');
      path.setAttribute('stroke-linejoin', 'round');
      icon.appendChild(path);
      var name = document.createElement('span');
      name.className = 'lan-bubble-file-name';
      name.innerText = file.fileName;
      var size = document.createElement('small');
      size.innerText = formatBytes(file.size);
      row.appendChild(icon);
      row.appendChild(name);
      row.appendChild(size);
      return row;
    }

    // 文本正文按需取回后铺在气泡里，再给出复制入口。
    function loadText(fileId, button, preview) {
      request(downloadUrl(fileId), 'GET', null, function (xhr) {
        preview.hidden = false;
        if (xhr.status !== 200) {
          preview.innerText = text.error + ' (' + xhr.status + ')';
          return;
        }
        preview.innerText = xhr.responseText;
        button.innerText = text.copy;
        button.dataset.action = 'copy';
        scrollToBottom();
      });
    }

    function copyText(preview, button) {
      var value = preview.innerText;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(value).then(
          function () {
            button.innerText = text.copied;
          },
          function () {
            button.innerText = text.copyFailed;
          }
        );
        return;
      }
      var range = document.createRange();
      range.selectNodeContents(preview);
      var selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      button.innerText = text.copyFailed;
    }

    // 电脑分享的每个文件都是一条收到的消息：左侧气泡 + 文件卡片 + 下载入口。
    function appendFileMessage(fileId, file, timestampMs) {
      insertDayLabel(timestampMs);

      var row = document.createElement('article');
      row.className = 'lan-bubble-row incoming';
      var timeEl = document.createElement('small');
      timeEl.className = 'lan-bubble-time';
      timeEl.innerText = formatMessageTime(timestampMs);
      var line = document.createElement('div');
      line.className = 'lan-bubble-line';
      var bubble = document.createElement('div');
      bubble.className = 'lan-bubble';
      bubble.appendChild(buildFileRow(file));

      var actions = document.createElement('div');
      actions.className = 'lan-bubble-actions';
      var link = document.createElement('a');
      link.className = 'lan-ghost';
      link.href = withPin(downloadUrl(fileId));
      link.download = file.fileName;
      link.innerText = text.download;
      actions.appendChild(link);

      var preview = null;
      if (isTextFile(file)) {
        var textButton = document.createElement('button');
        textButton.className = 'lan-ghost';
        textButton.type = 'button';
        textButton.innerText = text.showText;
        textButton.dataset.action = 'text';
        preview = document.createElement('pre');
        preview.className = 'lan-bubble-text lan-bubble-preview';
        preview.hidden = true;
        textButton.onclick = function () {
          if (textButton.dataset.action === 'text') {
            loadText(fileId, textButton, preview);
            return;
          }
          copyText(preview, textButton);
        };
        actions.appendChild(textButton);
      }

      bubble.appendChild(actions);
      if (preview) {
        bubble.appendChild(preview);
      }
      line.appendChild(bubble);
      row.appendChild(timeEl);
      row.appendChild(line);
      streamEl.appendChild(row);
      scrollToBottom();
    }

    /* ---------- 取回分享内容 ---------- */

    function renderFiles(files) {
      // 文件来自服务端的哈希表，按文件名排序后列表才是稳定的。
      var ids = Object.keys(files).sort(function (left, right) {
        return String(files[left].fileName).localeCompare(String(files[right].fileName));
      });
      peerHintEl.innerText = text.files.replace('%d', ids.length);
      if (!ids.length) {
        setNote(text.empty, false);
        setConnection('online');
        return;
      }
      setNote('', false);
      // 列表就是电脑此刻分享的内容，时间标签取页面拿到列表的时刻。
      var receivedAt = Date.now();
      ids.forEach(function (id) {
        appendFileMessage(id, files[id], receivedAt);
      });
      setConnection('online');
    }

    function loadFiles() {
      if (loading) {
        return;
      }
      loading = true;
      setNote(text.waiting, false);
      var url = BASE_URL + '/prepare-download';
      if (sessionId) {
        url += '?sessionId=' + encodeURIComponent(sessionId);
      }
      request(withPin(url), 'POST', null, function (xhr) {
        loading = false;
        if (xhr.status === 401) {
          pinErrorEl.innerText = pinTried ? text.pinInvalid : '';
          pinErrorEl.hidden = !pinTried;
          setNote(pinTried ? text.pinInvalid : text.pinHint, Boolean(pinTried));
          setConnection('pending');
          pinModal.hidden = false;
          pinInput.value = '';
          pinInput.focus();
          return;
        }
        if (xhr.status === 429) {
          setNote(text.pinTooMany, true);
          setConnection('offline');
          return;
        }
        if (xhr.status !== 200) {
          setNote(text.error + ' (' + xhr.status + ')', true);
          setConnection('offline');
          return;
        }
        var data = parseJson(xhr.responseText);
        if (!data) {
          setNote(text.error, true);
          setConnection('offline');
          return;
        }
        sessionId = data.sessionId;
        sessionStorage.setItem('ppSessionId', sessionId);
        if (data.info && data.info.alias) {
          setPeerName(data.info.alias);
        }
        renderFiles(data.files || {});
      });
    }

    function submitPin() {
      var value = pinInput.value.trim();
      if (!value) {
        return;
      }
      pin = value;
      pinTried = true;
      sessionStorage.setItem('ppPin', pin);
      pinModal.hidden = true;
      pinErrorEl.hidden = true;
      pinInput.value = '';
      loadFiles();
    }

    /* ---------- 交互绑定 ---------- */

    pinForm.onsubmit = function (event) {
      event.preventDefault();
      submitPin();
    };
    document.getElementById('pin-cancel').onclick = function () {
      pinModal.hidden = true;
      pinErrorEl.hidden = true;
      pinInput.value = '';
      setConnection('pending');
    };
    pinInput.onkeydown = function (event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        submitPin();
      }
    };

    applyStaticText();
    loadFiles();
  </script>
</body>
</html>

[package]
name = "power-paste"
version = "0.8.4"
description = "Native-feeling clipboard history manager"
authors = ["Codex"]
edition = "2021"
rust-version = "1.97.1"

# 内嵌的 LocalSend 协议核心库作为工作区成员，便于统一运行测试与 clippy。
[workspace]
members = ["vendor/localsend"]
default-members = ["."]
resolver = "2"

[lib]
name = "power_paste_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
localsend = { path = "vendor/localsend", features = ["crypto", "discovery", "http", "multicast"] }
pem = "4"
qrcode = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.10.3", features = [ "macos-private-api", "tray-icon", "image-png", "devtools"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-next = "0.2.4"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2.3.0"
tauri-plugin-single-instance = "2.4.0"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-updater = { version = "2.9.1", features = ["rustls-tls"], default-features = false }
thiserror = "2.0"
tiny_http = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "macros"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
tauri-plugin-drag = "2.1.1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_GdiPlus",
  "Win32_Globalization",
  "Win32_UI_Shell",
  "Win32_Storage_FileSystem",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
plist = "1.7"
